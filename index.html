<body>
<div id="frame"><main id="app">
<header><div class="brand" aria-hidden="true">½</div><div><div class="eyebrow">LAB MAYA · MATEMATIKA KELAS 5</div><h1>Ayo Bagi Bekal!</h1></div><nav class="nav" aria-label="Kegiatan belajar" id="nav"></nav><div class="utilities"><button class="icon-btn" id="lesson" aria-label="Materi: apa itu pecahan?">▤ Materi</button><button class="icon-btn utility-icon" id="sound" aria-pressed="true" aria-label="Matikan suara" title="Matikan suara">♪</button><button class="icon-btn utility-icon" id="fullscreen" aria-pressed="false" aria-label="Masuk layar penuh" title="Layar penuh">⛶</button><button class="icon-btn utility-icon" id="help" aria-label="Petunjuk bermain" title="Petunjuk">?</button></div></header>
<section class="food-menu" id="foodMenu" aria-label="Pilih makanan"></section>
<section class="workspace"><section class="stage" id="stage" aria-label="Meja berbagi makanan"></section><aside class="result" id="result" aria-label="Hasil pengamatan"></aside></section>
<footer><div class="progress-wrap"><div class="progress-track" role="progressbar" aria-label="Kegiatan selesai" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span id="progress"></span></div><strong id="progressText">0 / 5 kegiatan</strong></div><p class="footer-goal">Pilih potongan, kenali pecahannya, lalu bandingkan dan urutkan.</p><button class="btn small" id="history">Catatan (0)</button><button class="btn small" id="reset">↺ Mulai lagi</button><button class="btn small yellow" id="next">Lanjut →</button></footer>

</main></div>
<script>
"use strict";
const FOODS={bread:{name:'Roti',desc:'Lembut & keemasan',shape:'rect'},pizza:{name:'Pizza',desc:'Bundar & penuh keju',shape:'circle'},chocolate:{name:'Cokelat',desc:'Batang manis',shape:'rect'},pudding:{name:'Puding',desc:'Persegi atau persegi panjang',shape:'square'}};
const DENOMS=Array.from({length:23},(_,i)=>i+2);
const MODE_ORDER=[0,3,4,1,2];
const MODE_NAMES=['Potong & pilih','Bandingkan','Urutkan','Senilai','Sederhanakan'];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const compare=(a,b)=>Math.sign(a.n*b.d-b.n*a.d);
const simplest=f=>{const g=gcd(f.n,f.d);return{n:f.n/g,d:f.d/g};};
const plain=f=>f.n===0?'0':f.n%f.d===0?String(f.n/f.d):f.n>f.d?`${Math.floor(f.n/f.d)} ${f.n%f.d}/${f.d}`:`${f.n}/${f.d}`;
const escapeText=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fraction(f,mixed=false){if(mixed&&f.n>=f.d){const w=Math.floor(f.n/f.d),r=f.n%f.d;return r?`<span class="fraction" aria-label="${w} utuh dan ${r} per ${f.d}">${w}<span class="stack" aria-hidden="true"><span>${r}</span><span>${f.d}</span></span></span>`:`<span class="fraction">${w}</span>`;}return`<span class="fraction" aria-label="${f.n} per ${f.d}"><span class="stack" aria-hidden="true"><span>${f.n}</span><span>${f.d}</span></span></span>`;}
function initial(){return{mode:0,food:'pizza',pudding:'square',d:4,whole:1,cut:false,picked:[],a:{d:2,picked:[0]},b:{d:4,picked:[0,1]},guess:null,checked:false,sort:[{name:'Ibu',n:5,d:4},{name:'Nara',n:1,d:2},{name:'Ayah',n:3,d:2},{name:'Dito',n:3,d:4}],done:[false,false,false,false,false],eq:{n:1,d:2,k:2,ran:false},simplify:{n:6,d:12,k:2,ran:false},logs:[],message:'',good:false};}
let state=initial(),svgSerial=0,previousFocus=null;
function shape(food,pudding='square'){return food==='pudding'?pudding:FOODS[food].shape;}
function dimensions(food,pudding='square'){return shape(food,pudding)==='square'?{w:206,h:206}:shape(food,pudding)==='circle'?{w:220,h:220}:{w:266,h:180};}
function foodArt(food,pudding='square'){
 const {w,h}=dimensions(food,pudding),x=-w/2,y=-h/2;
 if(food==='pizza'){let toppings='';for(let i=0;i<9;i++){const angle=i*2.399,r=i===0?0:48+(i%2)*23,cx=Math.cos(angle)*r,cy=Math.sin(angle)*r;toppings+=`<circle cx="${cx}" cy="${cy}" r="10" fill="#e96545" stroke="#c44e35" stroke-width="2"/><circle cx="${cx-2}" cy="${cy-2}" r="2" fill="#ffc191"/><path d="M${cx+14},${cy+10}q13,-12 18,-2q-6,13 -18,2" fill="#639b56"/>`;}
 return`<circle r="110" fill="#d78b3f"/><circle r="101" fill="#f1ad59"/><circle r="94" fill="#e67446"/><circle r="89" fill="#ffda73"/>${toppings}<g fill="#fff1b2"><circle cx="-55" cy="-35" r="4"/><circle cx="32" cy="55" r="5"/><circle cx="55" cy="-49" r="4"/><circle cx="-20" cy="76" r="4"/></g>`;}
 if(food==='bread'){let dots='';for(let i=0;i<23;i++){const cx=x+19+(i*47)%(w-38),cy=y+20+(i*31)%(h-40);dots+=`<ellipse cx="${cx}" cy="${cy}" rx="${2+i%3}" ry="2" fill="#e1ad62" opacity=".7"/>`;}
 return`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#b96d30"/><rect x="${x+9}" y="${y+9}" width="${w-18}" height="${h-18}" fill="#e9ac59"/><rect x="${x+16}" y="${y+16}" width="${w-32}" height="${h-32}" fill="#ffe1a0"/>${dots}<path d="M-91,-63 Q0,-49 91,-63" fill="none" stroke="#fff0ca" stroke-width="5"/>`;}
 if(food==='chocolate')return`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#5c3029"/><rect x="${x+7}" y="${y+7}" width="${w-14}" height="${h-14}" fill="#9d5844"/><path d="M${x+7},${y+7}H${-x-7}l-12,12H${x+19}V${-y-19}l-12,12Z" fill="#c38261"/><rect x="${x+19}" y="${y+19}" width="${w-38}" height="${h-38}" fill="#a96249"/><path d="M-75,-42 Q-33,-61 9,-42 T88,-42" fill="none" stroke="#b97856" stroke-width="8" opacity=".7"/>`;
 return`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#c85079"/><rect x="${x+6}" y="${y+6}" width="${w-12}" height="${h-12}" fill="#f294b0"/><rect x="${x+13}" y="${y+13}" width="${w-26}" height="${h-26}" fill="#ffc0d0"/><path d="M${x+22},${y+29}H${-x-22}" stroke="#ffe8ed" stroke-width="7" stroke-linecap="round"/><g fill="#f49ab4"><circle cx="-38" cy="20" r="4"/><circle cx="45" cy="-12" r="4"/><circle cx="15" cy="56" r="3"/></g>`;
}
function grid(d,layout='auto'){if(layout==='strips')return{rows:1,cols:d};let rows=Math.floor(Math.sqrt(d));while(d%rows!==0)rows--;return{rows,cols:d/rows};}
function segment(food,pudding,d,j,layout='auto'){const {w,h}=dimensions(food,pudding);if(shape(food,pudding)==='circle'){if(d===1)return '<circle r="110"';const a=-Math.PI/2+j*2*Math.PI/d,b=-Math.PI/2+(j+1)*2*Math.PI/d;return`<path d="M0,0 L${110*Math.cos(a)},${110*Math.sin(a)} A110,110 0 ${b-a>Math.PI?1:0} 1 ${110*Math.cos(b)},${110*Math.sin(b)} Z"`;}
 const {rows,cols}=grid(d,layout);return`<rect x="${-w/2+(j%cols)*w/cols}" y="${-h/2+Math.floor(j/cols)*h/rows}" width="${w/cols}" height="${h/rows}"`;
}
function foodSVG({food=state.food,pudding=state.pudding,d=state.d,picked=[],whole=1,cut=true,who='main',interactive=true,compact=false,layout='auto'}={}){
 const serial=++svgSerial,W=compact?600:700,H=260,scale=compact?.91:1;let body='';
 for(let u=0;u<whole;u++){const cx=whole===1?W/2:W*(u===0?.26:.74),cy=122;const {w,h}=dimensions(food,pudding);const plate=shape(food,pudding)==='circle'?`<circle r="${w/2+11}" fill="#fffdf6" stroke="#eadfca" stroke-width="3"/>`:`<rect x="${-w/2-10}" y="${-h/2-10}" width="${w+20}" height="${h+20}" rx="12" fill="#fffdf6" stroke="#eadfca" stroke-width="3"/>`;
 let pieces=plate;if(!cut)pieces+=foodArt(food,pudding);else for(let j=0;j<d;j++){const index=u*d+j,selected=picked.includes(index),id=`clip-${serial}-${index}`,geometry=segment(food,pudding,d,j,layout),attrs=interactive?`class="slice" role="button" tabindex="0" id="piece-${who}-${index}" data-piece="${index}" data-who="${who}" aria-pressed="${selected}" aria-label="${selected?'Kembalikan':'Ambil'} potongan ${index+1} untuk ${who==='b'?'Dito':'Nara'}"`:'';pieces+=`<defs><clipPath id="${id}">${geometry}/></clipPath></defs><g ${attrs}><g clip-path="url(#${id})" opacity="${selected?1:.28}">${foodArt(food,pudding)}</g>${geometry} class="hit" fill="transparent" stroke="${selected?'#6246ba':'#fffdf8'}" stroke-width="${d>12?1.5:selected?3.5:3}" stroke-linejoin="round"/>${selected?selectedMark(food,pudding,d,j,layout):''}</g>`;}
 body+=`<g transform="translate(${cx} ${cy}) scale(${scale})">${pieces}</g><text x="${cx}" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#82776b">${whole===1?'1 makanan utuh':'Makanan '+(u+1)}</text>`;
 }

function commonDivisors(n,d){const g=gcd(n,d);return Array.from({length:g},(_,i)=>i+1).filter(k=>k>1&&g%k===0);}
function transformData(){const eq=state.mode===3,m=eq?state.eq:state.simplify;return{eq,m,result:eq?{n:m.n*m.k,d:m.d*m.k}:{n:m.n/m.k,d:m.d/m.k}};}
function transformCounter(key,m){return`<div class="counter"><span>Diambil</span><button id="minus-${key}" data-adjust="${key}" data-delta="-1" aria-label="Kurangi pembilang" ${m.n<=(key==='eq'?0:1)?'disabled':''}>−</button><output>${m.n}</output><button id="plus-${key}" data-adjust="${key}" data-delta="1" aria-label="Tambah pembilang" ${m.n>=m.d*2?'disabled':''}>+</button></div>`;}
function renderTransform(){
 const {eq,m,result}=transformData(),whole=m.n>m.d?2:1,key=eq?'eq':'simplify',factors=eq?Array.from({length:Math.min(6,Math.floor(24/m.d))-1},(_,i)=>i+2):commonDivisors(m.n,m.d),choices=factors.length?factors:[1];
 $('stage').innerHTML=`<div class="stage-top"><div><h2>${eq?'Potongan berubah, nilainya sama':'Gabungkan potongan kecil'}</h2><p>${eq?'Bagilah setiap potongan menjadi lebih kecil. Banyak makanannya tetap.':'Gabungkan bagian yang bersebelahan untuk menulis pecahan lebih sederhana.'}</p></div><span class="step-tag">${eq?'Pecahan senilai':'Menyederhanakan'}</span></div><div class="transform-controls"><label for="transformD">Bagian per makanan<select class="number-select" id="transformD">${(eq?DENOMS.filter(d=>d<=12):DENOMS).map(d=>`<option value="${d}" ${m.d===d?'selected':''}>${d}</option>`).join('')}</select></label>${transformCounter(key,m)}<label for="transformK">${eq?'Setiap potong jadi':'Gabungkan per'}<select class="number-select" id="transformK">${choices.map(k=>`<option value="${k}" ${m.k===k?'selected':''}>${k}${eq?' bagian':' potong'}</option>`).join('')}</select></label></div><div class="transform-grid"><article class="transform-card"><h3>Sebelum</h3><div style="text-align:center">${fraction(m)}</div><div class="transform-art">${foodSVG({d:m.d,picked:Array.from({length:m.n},(_,i)=>i),whole,interactive:false,compact:true,layout:'strips'})}</div><p class="transform-caption">${m.n} bagian diambil dari ${m.d} bagian per makanan.</p></article><article class="transform-card after"><h3>Sesudah ${eq?'dipotong lagi':'digabung'}</h3>${m.ran?`<div style="text-align:center">${fraction(result)}</div><div class="transform-art">${foodSVG({d:result.d,picked:Array.from({length:result.n},(_,i)=>i),whole,interactive:false,compact:true,layout:'strips'})}</div><p class="transform-caption">${result.n} bagian dari ${result.d} bagian per makanan. Banyaknya tetap!</p>`:`<div class="transform-art"><p class="waiting">${eq?'✂':'▦'}<br>Tekan <strong>${eq?'Potong lagi':'Gabungkan'}</strong><br>untuk melihat perubahan.</p></div>`}</article></div><div class="equation-note">${m.ran?`${m.n}/${m.d} = ${result.n}/${result.d} · ${eq?'Kalikan':'Bagi'} kedua angka dengan ${m.k}.`:'Ukuran makanan utuh dan jumlah makanan yang dipilih harus tetap sama.'}</div>`;
}
function renderTransformResult(){const {eq,m,result}=transformData(),finished=gcd(result.n,result.d)===1;
 $('result').innerHTML=`<h3>${eq?'Mengapa senilai?':'Bagaimana caranya?'}</h3><p class="muted">${eq?'Angka atas dan bawah dikali bilangan yang sama.':'Angka atas dan bawah dibagi bilangan yang sama.'}</p><div class="big-fraction transform-summary"><div style="display:flex;align-items:center;justify-content:center;gap:12px">${fraction(m)}${m.ran?`<span>=</span>${fraction(result)}`:''}</div><p>${eq?'×':'÷'} ${m.k} pada kedua angka</p></div><div class="feedback ${m.ran?'good':''}" role="status">${escapeText(state.message||(eq?'Coba 1/2 dikali 2. Apakah 2/4 sama banyak?':m.k===1?'Pecahan ini sudah paling sederhana. Tidak ada pembagi bersama selain 1.':'Coba 6/12 dibagi 2 menjadi 3/6. Lalu lanjutkan sampai paling sederhana.'))}</div>${m.ran&&!eq?`<p class="muted">${finished?'Sudah paling sederhana: kedua angka tidak memiliki pembagi bersama selain 1.':'Masih bisa disederhanakan. Gabungkan lagi atau pilih pembagi yang lebih besar.'}</p>${!finished?'<button class="btn subtle" id="useTransformResult">Lanjutkan dari hasil</button>':''}`:''}<button class="btn primary main-action" id="runTransform">${eq?'✂ Potong lagi':m.k===1?'✓ Catat hasil':'▦ Gabungkan'}</button>`;
}
function normalizeTransform(){const {eq,m}=transformData();m.n=Math.max(eq?0:1,Math.min(m.n,m.d*2));if(eq)m.k=Math.max(2,Math.min(m.k,Math.min(6,Math.floor(24/m.d))));else{const divs=commonDivisors(m.n,m.d);if(!divs.includes(m.k))m.k=divs[0]||1;}m.ran=false;clearFeedback();}
function lesson(){openModal('Apa itu pecahan?',`<p class="lesson-definition"><strong>Pecahan</strong> menyatakan bagian dari satu utuh yang dibagi menjadi <strong>bagian-bagian sama besar</strong>.</p><div class="lesson-layout"><div class="lesson-art">${foodSVG({food:'pizza',d:4,picked:[0],whole:1,interactive:false})}<p style="text-align:center">1 dari 4 potong pizza dipilih.</p></div><div style="text-align:center">${fraction({n:1,d:4})}<div class="lesson-label"><strong>1 = pembilang</strong><br>Banyak bagian yang diambil.</div><div class="lesson-label"><strong>4 = penyebut</strong><br>Banyak bagian sama besar dalam satu utuh.</div></div></div><p class="tip"><strong>Ingat:</strong> penyebut tidak boleh nol. Saat membandingkan, ukuran satu makanan utuh harus sama. Pecahan 5/4 berarti 1 makanan utuh dan 1/4 lagi, ditulis <strong>1 1/4</strong>.</p><div class="modal-nav"><button class="btn primary" id="lessonPractice">Ayo coba potong makanan →</button></div>`);}
function handleExtras(e){
 const id=e.target.id;
 if(id==='sound'){soundEnabled=!soundEnabled;syncSound();if(soundEnabled)playSound('click');announce(soundEnabled?'Suara dinyalakan.':'Suara dimatikan.');return true;}
 if(id==='fullscreen'){playSound('click');toggleFullscreen();return true;}
 if(id==='lesson'){playSound('click');lesson();return true;}
 if(id==='lessonPractice'){playSound('click');closeModal();state.mode=0;clearFeedback();render();return true;}
 const adjust=e.target.closest('[data-adjust]');if(adjust&&!adjust.disabled){const m=state[adjust.dataset.adjust];m.n+=Number(adjust.dataset.delta);normalizeTransform();playSound('click');render();return true;}
 if(id==='runTransform'){
  const {eq,m,result}=transformData();m.ran=true;
  if(eq||gcd(result.n,result.d)===1)state.done[state.mode]=true;
  const statement=`${m.n}/${m.d} = ${result.n}/${result.d}. ${eq?'Kalikan':'Bagi'} pembilang dan penyebut dengan ${m.k}.`;
  log(statement,{n:m.n,d:m.d});setMessage(eq?'Pecahan senilai! Banyak makanannya tetap sama.':gcd(result.n,result.d)===1?'Sudah paling sederhana. Banyak makanannya tetap sama.':'Masih bisa disederhanakan. Coba lanjutkan dari hasil.',true);render();return true;
 }
 if(id==='useTransformResult'){const {result}=transformData();state.simplify.n=result.n;state.simplify.d=result.d;normalizeTransform();playSound('click');render();return true;}
 return false;
}
function changeExtras(e){
 if(e.target.id==='mainDivide'){state.d=Number(e.target.value);state.cut=false;state.picked=[];clearFeedback();playSound('click');render();return true;}
 if(e.target.id==='transformD'||e.target.id==='transformK'){const {m}=transformData();if(e.target.id==='transformD')m.d=Number(e.target.value);else m.k=Number(e.target.value);normalizeTransform();playSound('click');render();return true;}
 return false;
}
syncSound();syncFullscreen();

fit();render();
</script>
</body>
</html>
